<svg width="100%" height="200" viewBox="0 0 1000 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#feca57;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGlow stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Space background -->
  <rect width="1000" height="200" fill="#0a0a23"/>
  
  <!-- Stars -->
  <circle cx="50" cy="30" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="120" cy="80" r="1" fill="white" opacity="0.6"/>
  <circle cx="200" cy="40" r="2" fill="white" opacity="0.9"/>
  <circle cx="300" cy="120" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="400" cy="60" r="1" fill="white" opacity="0.5"/>
  <circle cx="500" cy="150" r="2" fill="white" opacity="0.8"/>
  <circle cx="600" cy="40" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="700" cy="100" r="1" fill="white" opacity="0.4"/>
  <circle cx="800" cy="160" r="2" fill="white" opacity="0.9"/>
  <circle cx="900" cy="50" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="950" cy="120" r="1" fill="white" opacity="0.5"/>
  <circle cx="150" cy="160" r="1" fill="#00f2fe" opacity="0.6"/>
  <circle cx="350" cy="80" r="1.5" fill="#00f2fe" opacity="0.6"/>
  <circle cx="450" cy="140" r="1" fill="#00f2fe" opacity="0.4"/>
  <circle cx="750" cy="30" r="2" fill="#00f2fe" opacity="0.8"/>
  
  <!-- Planet -->
  <circle cx="850" cy="60" r="40" fill="#ff9ff3" opacity="0.9"/>
  <circle cx="840" cy="50" r="8" fill="white" opacity="0.3"/>
  <circle cx="860" cy="70" r="5" fill="white" opacity="0.2"/>
  
  <!-- Moon -->
  <circle cx="920" cy="40" r="15" fill="#dfe6e9" opacity="0.9"/>
  <circle cx="925" cy="35" r="3" fill="#b2bec3" opacity="0.5"/>
  
  <!-- Spaceship -->
  <g transform="translate(200, 100)" filter="url(#glow)">
    <!-- Engine glow -->
    <path d="M-30,40 Q-10,60 10,40 Q-10,20 -30,40" fill="#feca57" opacity="0.6"/>
    <path d="M-25,40 Q-5,55 5,40 Q-5,25 -25,40" fill="#ff9ff3" opacity="0.4"/>
    
    <!-- Ship body -->
    <path d="M0,0 L40,0 L40,50 L0,50 Z" fill="url(#shipGrad)"/>
    <path d="M10,10 L30,10 L30,20 L10,20 Z" fill="#2d3436"/>
    <path d="M15,15 L25,15 L25,18 L15,18 Z" fill="#ff7675"/>
    
    <!-- Wings -->
    <path d="M-20,25 L0,25 L0,35 L-20,35 Z" fill="#55efc4" opacity="0.8"/>
    <path d="M40,25 L60,25 L60,35 L40,35 Z" fill="#55efc4" opacity="0.8"/>
    
    <!-- Cockpit -->
    <circle cx="20" cy="25" r="8" fill="#00f2fe" opacity="0.9"/>
    <circle cx="20" cy="25" r="3" fill="white" opacity="0.8"/>
  </g>
  
  <!-- Text -->
  <text x="500" y="170" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="2">
    Infrastructure &amp; Automation &amp; Robotics
  </text>
  <text x="500" y="190" font-family="Arial, sans-serif" font-size="14" fill="#00f2fe" text-anchor="middle" opacity="0.8">
    Built by Arthur (@septimusgorne) • DevOps at Kaspersky Lab
  </text>
</svg>
